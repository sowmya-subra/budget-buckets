[project]
name = "budget-buckets"
version = "0.1.0"
description = "Daily transaction bucketing with a push digest and budget dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
budget-buckets = "budget_buckets:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
